server.port=8081

spring.application.name=spring-webflux-io-http

downstream.url=${DOWNSTREAM_URL:http://localhost:9090}
downstream.http.pool.max-connections=${DOWNSTREAM_HTTP_POOL_MAX_CONNECTIONS:2000}
downstream.http.pool.pending-acquire-max-count=${DOWNSTREAM_HTTP_POOL_PENDING_ACQUIRE_MAX:5000}
downstream.http.timeout.connect-ms=${DOWNSTREAM_HTTP_CONNECT_MS:5000}
downstream.http.timeout.response-ms=${DOWNSTREAM_HTTP_RESPONSE_MS:30000}

logging.level.root=WARN
logging.level.com.tcc.concurrency=WARN
