server.port=8080

server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:5000}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}

spring.application.name=spring-mvc-io

#spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
#spring.datasource.username=testuser
#spring.datasource.password=testpass
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=50
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

workload.io.file.path=/tmp/benchmark-mvc.log
workload.io.file.payload-size-bytes=10240

downstream.url=http://localhost:9090
downstream.http.pool.max-total=2000
downstream.http.pool.max-per-route=2000
downstream.http.timeout.connect-ms=5000
downstream.http.timeout.read-ms=30000

logging.level.root=WARN
logging.level.com.tcc.concurrency=WARN
