server.port=8080

server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:5000}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}

spring.application.name=spring-mvc-io-http

downstream.url=${DOWNSTREAM_URL:http://localhost:9090}
downstream.http.pool.max-total=${DOWNSTREAM_HTTP_POOL_MAX_TOTAL:2000}
downstream.http.pool.max-per-route=${DOWNSTREAM_HTTP_POOL_MAX_PER_ROUTE:2000}
downstream.http.timeout.connect-ms=${DOWNSTREAM_HTTP_CONNECT_MS:5000}
downstream.http.timeout.read-ms=${DOWNSTREAM_HTTP_READ_MS:30000}

logging.level.root=WARN
logging.level.com.tcc.concurrency=WARN
