server.port=${SERVER_PORT:8083}

spring.application.name=spring-webflux-io-db

spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/testdb}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:testuser}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:testpass}

spring.r2dbc.pool.initial-size=${R2DBC_POOL_INITIAL_SIZE:50}
spring.r2dbc.pool.max-size=${R2DBC_POOL_MAX_SIZE:50}
spring.r2dbc.pool.max-acquire-time=30s
spring.r2dbc.pool.max-idle-time=10m
spring.r2dbc.pool.max-life-time=30m

workload.io.db.sleep-seconds=${WORKLOAD_IO_DB_SLEEP_SECONDS:0.1}

logging.level.root=WARN
logging.level.com.tcc.concurrency=WARN
logging.level.io.r2dbc=WARN
