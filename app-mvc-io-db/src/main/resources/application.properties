server.port=${SERVER_PORT:8082}

server.tomcat.threads.max=${TOMCAT_THREADS_MAX:400}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:5000}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}

spring.application.name=spring-mvc-io-db

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:testuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:testpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:50}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:50}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

workload.io.db.sleep-seconds=${WORKLOAD_IO_DB_SLEEP_SECONDS:0.1}

logging.level.root=WARN
logging.level.com.tcc.concurrency=WARN
